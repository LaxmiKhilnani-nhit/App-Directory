name: app-directory

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appdir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-appdir}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: the database is reachable only from the api container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appdir} -d ${POSTGRES_DB:-appdir}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-appdir}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-appdir}
      APP_NAME: ${APP_NAME:-App Directory}
      RUST_LOG: ${RUST_LOG:-info}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      # Publish on every interface so the LAN address (172.168.50.50) always works. Restrict
      # access with the host firewall if the VM has more than one network. Using the LAN IP
      # here previously caused "connection refused" whenever .env still said 127.0.0.1.
      - "0.0.0.0:8090:8090"
    volumes:
      - ./backups:/backups

volumes:
  pgdata:
