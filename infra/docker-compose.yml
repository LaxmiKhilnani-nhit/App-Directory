name: app-directory

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-App Directory}
      RUST_LOG: ${RUST_LOG:-info}
      DATA_DIR: /app/data
      # Optional: point this at the portable client if it is not at the default path.
      # CLIENT_EXE: /app/client/App Directory.exe
    ports:
      # Publish on every interface so the LAN address (172.168.50.50) always works. Restrict
      # access with the host firewall if the VM has more than one network.
      - "0.0.0.0:8090:8090"
    volumes:
      # All state lives here: users.csv, groups.csv, apps.csv, settings.csv, audit.csv,
      # revision.csv and icons/. Hand-editing a file is picked up on the next request.
      - ./data:/app/data
      # Portable Windows client, served at /download/app-directory.exe. Place the .exe in
      # the repo's release/ folder; no image rebuild is needed to publish a new client.
      - ../release:/app/client:ro
